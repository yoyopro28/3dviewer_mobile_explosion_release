<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="author" content="Joe Martens" />
  <meta name="x-fingerprint" content="JM-3DVIEWER-2026-02-15-6f2c9a9d" />
  <title>Mobile 3D FPS Viewer</title>

  <style>
    html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden}
    body{background:#1d1d1d}
    canvas{display:block;touch-action:none}
    #loadingSpinner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(30,30,30,.85);color:#3fcf8e;font-family:sans-serif;font-size:1.1em;padding:1.5em 3em;border-radius:18px;z-index:150}
    #menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(30,30,30,.98);color:#fff;padding:2em 3vw;border-radius:18px;text-align:center;font-family:sans-serif;box-shadow:0 16px 64px rgba(0,0,0,.35);z-index:100;min-width:230px;max-width:96vw;display:none}
    #menu label{display:block;margin-bottom:.7em;font-size:1.08em}
    #menu input[type=range]{width:90vw}
    #menu .slider-tip{color:#aaa;font-size:.95em;margin-bottom:.6em}
    #menu input[type=checkbox]{transform:scale(1.2);margin-right:.5em}
    #menu button{background:#3fcf8e;color:#222;border:none;padding:.7em 2em;border-radius:11px;font-size:1em;margin-top:1.2em}
    #menu button:last-child{background:#222;color:#3fcf8e;margin-left:1em}
    #mobileControls{pointer-events:none}
    #mobileControls *{pointer-events:auto;user-select:none;-webkit-user-select:none}
    @media (max-width:600px){#menu{padding:1em 2vw}#menu label{font-size:1em}}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
</head>

<body>
  <div id="loadingSpinner">Lade Modell ...</div>

  <div id="menu">
    <label for="speedSlider">Bewegungsgeschwindigkeit: <span id="speedValue">30</span></label>
    <input type="range" min="0" max="30" step="0.1" id="speedSlider" value="20">
    <div class="slider-tip">(Sprint: <span id="sprintValue">40</span>)</div>

    <label for="scaleSlider" style="margin-top:1.4em;">Modell-Scale: <span id="scaleValue">0.02</span></label>
    <input type="range" min="0.001" max="0.08" step="0.0001" id="scaleSlider" value="0.02">
    <div class="slider-tip"></div>

    <div style="margin-top:1.4em; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; margin:0;">
        <input type="checkbox" id="flyToggle">
        <span>Flugmodus</span>
      </label>

      <label style="display:flex; align-items:center; gap:8px; margin:0;">
        <input type="checkbox" id="sunToggle" checked>
        <span>Sonne + Schatten</span>
      </label>
    </div>

    <button id="toggleExplode">Schichten aufklappen</button>
    <button id="resetPosition">Zurück zum Start</button>
    <button id="closeMenu">Schließen</button>
  </div>

  <div id="mobileControls" style="display:none;">
    <div id="joystickZone" style="position:fixed; left:10px; bottom:10px; width:110px; height:110px; z-index:50;"></div>
    <div style="position:fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); z-index:50; display:flex; flex-direction:column; gap:12px;">
      <button id="btnMenu" style="width:48px;height:48px;border-radius:50%;background:#222;color:#3fcf8e;font-size:1.08em;">≡</button>
      <button id="btnExplode" style="width:48px;height:48px;border-radius:50%;background:#222;color:#3fcf8e;font-size:0.95em;">⤢</button>
      <button id="btnLayers" style="width:48px;height:48px;border-radius:50%;background:#222;color:#3fcf8e;font-size:0.72em;">LAY</button>
      <button id="btnUp" style="width:48px;height:48px;border-radius:50%;background:#3fcf8e;color:#222;font-size:1.3em;">↑</button>
      <button id="btnDown" style="width:48px;height:48px;border-radius:50%;background:#3fcf8e;color:#222;font-size:1.3em;">↓</button>
    </div>
  </div>

  <div id="layerPanel" style="
    position:fixed; right:12px; top: calc(12px + env(safe-area-inset-top)); z-index:60;
    background:rgba(20,20,20,0.92); color:#fff;
    padding:12px; border-radius:14px; font-family:sans-serif;
    width:min(260px, 82vw);
    display:none;
    box-shadow:0 16px 64px rgba(0,0,0,0.35);
  ">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <div style="font-weight:700;">Layer</div>
      <button id="btnCloseLayerPanel" style="
        background:#222; color:#3fcf8e; border:none; border-radius:10px;
        padding:6px 10px; font-size:0.95em;
      ">✕</button>
    </div>

    <div style="display:flex; gap:10px; margin:10px 0 8px;">
      <button id="btnLayersAllOn" style="
        flex:1; background:#3fcf8e; color:#222; border:none;
        border-radius:10px; padding:8px; font-size:0.95em;
      ">Alle an</button>
      <button id="btnLayersAllOff" style="
        flex:1; background:#222; color:#3fcf8e; border:1px solid #3fcf8e;
        border-radius:10px; padding:8px; font-size:0.95em;
      ">Alle aus</button>
    </div>

    <div id="layerList" style="max-height:44vh; overflow:auto; padding-right:6px;"></div>
  </div>

  <script type="module" src="./bootstrap.mjs"></script>
</body>
</html>
